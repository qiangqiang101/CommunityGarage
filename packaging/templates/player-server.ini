[server]
; The community server. Leave these as they are.
host=forza.imnotmental.com
port=443
scheme=https
path_prefix=
insecure_tls=0

[drivatars]
; Names the AI drivers (Drivatars) wear.
; server = Community Garage players' names, a new random pick each time you start the game.
; off    = the game's own AI driver names.
names=server

[updates]
; 1 = let the mod platform check GitHub (about every 6 hours) for a newer Community Garage and tell you on the title screen.
; 0 = never look. Nothing is downloaded or installed automatically.
check=1
